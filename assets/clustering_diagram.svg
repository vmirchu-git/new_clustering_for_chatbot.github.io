<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="300" fill="#14131a"/>

  <text x="600" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8e6e1" text-anchor="middle" letter-spacing="3">CLUSTERING MODEL SELECTION</text>
  <text x="600" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a877e" text-anchor="middle" letter-spacing="1">blind human evaluation + automated metrics, in parallel</text>

  <!-- Box 1 -->
  <rect x="55" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="180" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">4 candidate models</text>
  <text x="180" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">classical, hybrid, LLM-enhanced,</text>
  <text x="180" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">fine-tuned LLM checkpoint</text>

  <!-- Box 2 -->
  <rect x="335" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="460" y="125" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Blind evaluation</text>
  <text x="460" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">human raters, same dataset,</text>
  <text x="460" y="163" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">model identity hidden</text>

  <!-- Box 3 -->
  <rect x="615" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="740" y="125" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Automated metrics</text>
  <text x="740" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">Purity, Inverse Purity,</text>
  <text x="740" y="163" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">F-score, AMI</text>

  <!-- Box 4 -->
  <rect x="895" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="1020" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Best model selected</text>
  <text x="1020" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">top across all four</text>
  <text x="1020" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">evaluation metrics</text>

  <!-- Arrows -->
  <line x1="305" y1="145" x2="333" y2="128" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="145" x2="333" y2="162" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="130" x2="613" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="865" y1="160" x2="893" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Divider -->
  <line x1="60" y1="222" x2="1140" y2="222" stroke="#3a3840" stroke-width="1"/>

  <!-- Stat callouts -->
  <text x="230" y="256" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c9a227" text-anchor="middle">4</text>
  <text x="230" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">clustering approaches compared</text>

  <text x="600" y="256" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c9a227" text-anchor="middle">2</text>
  <text x="600" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">independent evaluation methods</text>

  <text x="970" y="256" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c9a227" text-anchor="middle">in production</text>
  <text x="970" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">since early 2025</text>
</svg>
